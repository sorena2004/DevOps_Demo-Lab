name: flask-app ci pipeline
on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master
      - develop
jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - name: setup python
        uses: actions/setup-python@v4
        with: 
          python-version: 3.12 
      - name: checkout the code 
        uses: actions/checkout@v4
      - name: install indpendency 
        run: python -m pip install -r Github-Action/app/requirements.txt
      - name: run tests 
        run: cd Github-Action/app && pytest -v 