---
- name: initial linux server setup
  hosts: servers
  become: true

  tasks:
    - name: install basic packages
      apt:
        name:
          - curl
          - wget
          - htop
          - iftop
          - vim
          - unzip
          - git
          - openvpn
          - fail2ban
        state: present
  roles:
    - users
    - ssh
    - fail2ban
