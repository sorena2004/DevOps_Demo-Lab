apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: task-service
  namespace: production

spec:
  scalTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: task-service

  minReplicas: 2
  maxReplicas: 5

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        type: pods
        value: 5
        periodSedconds: 60

    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: pods
          value: 1
          periodSeconds: 120

    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 70

