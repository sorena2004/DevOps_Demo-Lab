apiVersion: v1
kind: ConfigMap

metadata:
  name: grafana-dashboard-provider
  namespace: monitoring

data:
  provider.yaml: |
    apiVersion: 1

    providers:

      - name: Kubernetes
        orgId: 1

        type: file

        disableDeletion: false
        editable: true

        options:
          path: /var/lib/grafana/dashboards
