apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: cadvisor
  namespace: monitoring

spec:
  selector:
    matchLabels:
      app: cadvisor

  template:
    metadata:
      labels:
        app: cadvisor

    spec:
      containers:
        - name: cadvisor

          image: gcr.io/cadvisor/cadvisor:v0.49.2

          ports:
            - name: http
              containerPort: 8080

          args:
            - --housekeeping_interval=10s
            - --docker_only=false

          securityContext:
            privileged: true

          volumeMounts:
            - name: rootfs
              mountPath: /rootfs
              readOnly: true

            - name: var-run
              mountPath: /var/run

            - name: sys
              mountPath: /sys
              readOnly: true

            - name: docker
              mountPath: /var/lib/docker
              readOnly: true

            - name: disk
              mountPath: /dev/disk
              readOnly: true

      volumes:

        - name: rootfs
          hostPath:
            path: /

        - name: var-run
          hostPath:
            path: /var/run

        - name: sys
          hostPath:
            path: /sys

        - name: docker
          hostPath:
            path: /var/lib/docker

        - name: disk
          hostPath:
            path: /dev/disk
