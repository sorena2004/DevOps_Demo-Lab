apiVersion: v1
kind: ConfigMap

metadata:
  name: prometheus-config
  namespace: monitoring

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:

      # API Gateway
      - job_name: api-gateway
        metrics_path: /metrics
        static_configs:
          - targets:
              - api-service.production.svc.cluster.local:3000

      # User Service
      - job_name: user-service
        metrics_path: /metrics
        static_configs:
          - targets:
              - user-service.production.svc.cluster.local:3001

      # Task Service
      - job_name: task-service
        metrics_path: /metrics
        static_configs:
          - targets:
              - task-service.production.svc.cluster.local:3002

      # Kubernetes State Metrics
      - job_name: kube-state-metrics
        static_configs:
          - targets:
              - kube-state-metrics.monitoring.svc.cluster.local:8080

      # cAdvisor
      - job_name: cadvisor
        static_configs:
          - targets:
              - cadvisor.monitoring.svc.cluster.local:8080
