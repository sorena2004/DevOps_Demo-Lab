apiVersion: apps/v1
kind: Deployment

metadata:
  name: prometheus
  namespace: monitoring

spec:
  replicas: 1

  selector:
    matchLabels:
      app: prometheus

  template:
    metadata:
      labels:
        app: prometheus

    spec:
      serviceAccountName: prometheus

      containers:
        - name: prometheus

          image: prom/prometheus:v3.5.0

          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus

          ports:
            - name: web
              containerPort: 9090

          resources:
            requests:
              cpu: 200m
              memory: 512Mi

            limits:
              cpu: 500m
              memory: 1Gi

          volumeMounts:
            - name: config
              mountPath: /etc/prometheus

            - name: rules
              mountPath: /etc/prometheus/rules

            - name: storage
              mountPath: /prometheus

      volumes:
        - name: config
          configMap:
            name: prometheus-config

        - name: rules
          configMap:
            name: prometheus-rules

        - name: storage
          emptyDir: {}
