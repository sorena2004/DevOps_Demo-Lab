apiVersion: v1
kind: ConfigMap

metadata:
  name: prometheus-rules
  namespace: monitoring

data:
  alerts.yml: |
    groups:

      - name: microservices-alerts

        rules:

          - alert: MicroserviceDown

            expr: up{namespace="production"} == 0

            for: 1m

            labels:
              severity: critical

            annotations:
              summary: "Microservice is down"
              description: "Instance {{ $labels.instance }} is down."

          - alert: HighErrorRate

            expr: |
              (
                sum by (service) (
                  rate(http_requests_total{status_code=~"5.."}[5m])
                )
                /
                sum by (service) (
                  rate(http_requests_total[5m])
                )
              ) > 0.05

            for: 2m

            labels:
              severity: warning

            annotations:
              summary: "High HTTP 5xx error rate"
              description: "{{ $labels.service }} has more than 5% HTTP 5xx errors."

          - alert: HighRequestLatency

            expr: |
              histogram_quantile(
                0.95,
                sum by (service, le) (
                  rate(http_request_duration_seconds_bucket[5m])
                )
              ) > 1

            for: 2m

            labels:
              severity: warning

            annotations:
              summary: "High request latency"
              description: "{{ $labels.service }} P95 latency is above 1 second."

          - alert: PodRestarting

            expr: |
              increase(
                kube_pod_container_status_restarts_total[10m]
              ) > 3

            for: 5m

            labels:
              severity: warning

            annotations:
              summary: "Pod is restarting frequently"
              description: "Pod {{ $labels.pod }} restarted more than 3 times."
