name: flask-app ci pipeline
on:
  pull_request:
    branches:
      - master
      - develop
jobs:
  CI:
    runs-on: self-hosted
    steps:
      - name: setup python
        uses: actions/setup-python@v4
        with: 
          python-version: 3.12
      - name: checkout the code 
        uses: actions/checkout@v4
      - name: install indpendency 
        run: python -m pip install -r app/requirements.txt
      - name: run tests
        run: cd app && pytest -v 
